<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>movievault</title>
<style>
  :root {
    --bg: #0d0b13;
    --panel: rgba(20, 18, 28, 0.88);
    --line: #3a3550;
    --ink: #cfcadd;
    --accent: #d2783c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  img { user-select: none; }

  /* un solo stage de 2816x1536: el campo de vision no cambia nunca */
  #fit { position: absolute; transform-origin: 0 0; }
  #stage { position: relative; width: 2816px; height: 1536px; overflow: hidden; }
  .etapa[hidden] { display: none; }
  .layer { position: absolute; top: 0; left: 0; width: 2816px; height: 1536px; }

  #hotspot {
    position: absolute; left: 1697px; top: 177px; width: 830px; height: 1252px;
    border: 6px solid transparent; border-radius: 10px;
    background: transparent; cursor: pointer; padding: 0; z-index: 9;
  }
  #hotspot:hover, #hotspot:focus-visible {
    border-color: rgba(210, 120, 60, .85);
    background: rgba(210, 120, 60, .10);
    outline: none;
  }

  /* --- etapa frontal ---
     las capas se hornean en un canvas alto (2816x3403) que cubre todo el recorrido
     vertical de camara. como la camara es ortografica, moverla en Z es una
     traslacion pura de pixeles: el paneo es un translateY, no un re-render.
     encuadre: el armario (shelf-frame) ocupa 75% del ancho de pantalla (12.5%
     de margen por lado) y su techo cae al 10% desde arriba de #stage. */
  #pan { position: absolute; top: 0; left: 0; width: 2816px; height: 3403px;
         will-change: transform; }
  .capa-alta { position: absolute; top: 0; left: 0; width: 2816px; height: 3403px; }
  #f-scene { z-index: 1; }
  #f-back  { z-index: 2; }
  #plates {
    position: absolute; overflow: hidden; z-index: 3;
    left: 433.23px; top: 397.38px; width: 1949.54px; height: 2599.38px;
  }
  #f-frame { z-index: 4; }
  /* zocalo estirado: la misma tabla de front-frame.png, mas alta. ancla el
     borde de ABAJO (fijo, y=3403) y estira el borde de ARRIBA hacia arriba
     para tapar el hueco que deja la ultima bandeja, dejando ~12px de margen
     negro antes de la bandeja/riel (no se tocan). va despues de #f-frame en
     el DOM asi cubre la tabla original sin estirar que queda debajo. */
  #f-zocalo-estirado {
    position: absolute; z-index: 4; pointer-events: none;
    left: 0; top: 2932.95px; width: 2816px; height: 470.05px;
    overflow: hidden;
  }
  #f-zocalo-estirado img {
    position: absolute; left: 0; top: -3467.05px;
    width: 2816px; height: 3935.4px;
  }
  /* sonda de geometria: define que cuenta como "encima del armario" */
  #zona-armario {
    position: absolute; z-index: 5; pointer-events: none;
    left: 352.00px; top: 153.68px; width: 2112.00px; height: 3249.23px;
  }
  /* --- estante ---
     caja de 3 caras (frente / arriba / abajo) en vez de una placa plana: al girar,
     una placa plana se achica a nada y no se lee de que lado va. sin `perspective`
     en ningun ancestro la proyeccion es ortografica, igual que cam-travel, asi que
     el frente escorza por cos(t) y la tapa crece por sin(t) sin deformarse.
     cada .cara lleva su propio render ortografico dead-on de esa cara de la bandeja,
     asi que la textura y la geometria son la misma cosa.
     bandeja 1.142 x 0.17 x 0.22 m -> 1855.31 x 173 x 357.42 px a 1624.6153 px/m
     (el ancho/alto de bandeja escalan con PPM; profundidad y textura de las
     caras vienen de cam-tray-front/-top/-bottom, resolucion propia sin relacion
     con esta escala). la profundidad entra en los 0.27 m que separan el tramo
     frontal del trasero (2 * R_POLEA) y le sobra para una caja de DVD parada
     (0.135). 2026-08-08: riel pegado a la tabla real (shelf-void/shelf-frame
     SIN TOCAR, siguen en 0.544/1.744 y 0.494/1.794 como siempre), gap
     estante-riel intacto en 19mm. left: 47.11px = borde de bandeja (0.573)
     menos borde de #plates (shelf-void, 0.544), proyectado. */
  .plate {
    position: absolute; top: 0; left: 47.11px;
    width: 1855.31px; height: 357.42px;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .cara {
    position: absolute; left: 50%; top: 50%;
    backface-visibility: hidden;   /* la cara de abajo no se cuela cuando se ve la de arriba */
  }
  /* con giro 0 la tapa y el fondo quedan de canto: area proyectada cero, pero el
     browser igual las pinta como una linea de 1 px con su borde. se apagan y se
     encienden solo mientras el estante gira. */
  .cara-arriba, .cara-abajo { display: none; }
  .plate.girando .cara-arriba, .plate.girando .cara-abajo { display: block; }
  .cara { background-size: 100% 100%; }
  .cara-frente {
    width: 1855.31px; height: 357.42px;
    transform: translate(-50%, -50%) translateZ(138.09px);
    background-image: url("renders/layers/front/tray--front.png");
  }
  /* mientras el estante gira, uno de sus dos cantos se esta metiendo en la madera:
     el de arriba en el arco de arriba, el de abajo en el de abajo. la sombra se
     apoya en ese canto y se va con el giro, asi que de frente (giro 0) queda en
     cero y la cara sale tal cual la horneo blender.
     el degradado ocupa la cara ENTERA y lo que crece con el giro es la opacidad,
     no el tamaño: girando, el estante ademas baja y sale por debajo de la
     abertura, asi que a -40 grados solo queda a la vista el 12% de arriba de la
     cara. una mancha escalada desde el canto de abajo cae entera en la parte
     recortada y no se ve un pixel — medido con diff A/B. */
  .sombra {
    display: block; position: absolute; inset: 0;
    pointer-events: none;
  }
  .sombra-sup {
    opacity: var(--som-sup, 0);
    background: linear-gradient(to bottom, rgba(0,0,0,.95), rgba(0,0,0,.72) 40%, rgba(0,0,0,.48));
  }
  .sombra-inf {
    opacity: var(--som-inf, 0);
    background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.72) 40%, rgba(0,0,0,.48));
  }
  /* tapa: el borde de adelante es el borde INFERIOR de la cara (rotateX(90deg)
     manda el +y local hacia el observador), y el render de arriba sale con el
     frente de la bandeja abajo. calzan sin espejar */
  .cara-arriba {
    width: 1855.31px; height: 276.18px;
    transform: translate(-50%, -50%) translateY(-178.71px) rotateX(90deg);
    background-image: url("renders/layers/front/tray--top.png");
  }
  /* fondo del estante: aca el borde de adelante es el SUPERIOR (rotateX(-90deg)),
     y el render de abajo sale con el frente arriba. tambien calza derecho */
  .cara-abajo {
    width: 1855.31px; height: 276.18px;
    transform: translate(-50%, -50%) translateY(178.71px) rotateX(-90deg);
    background-image: url("renders/layers/front/tray--bottom.png");
  }

  #dbg {
    position: fixed; bottom: 10px; left: 10px; z-index: 20;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 9px; color: #8b85a3; font-variant-numeric: tabular-nums;
  }
  #dbg b { color: var(--ink); font-weight: 600; }
  #dbg .modo { color: var(--accent); }
  #volver {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 13px; cursor: pointer; font: inherit;
  }
  #volver:hover { border-color: var(--accent); }
  #volver[hidden] { display: none; }
</style>
</head>
<body>

<div id="fit">
  <div id="stage">

    <div class="etapa" id="etapa-room">
      <img class="layer" src="renders/layers/room/room.png" alt="" draggable="false">
      <button id="hotspot" title="ir a la estanteria"></button>
    </div>

    <div class="etapa" id="etapa-viaje" hidden>
      <img class="layer" id="cuadro" alt="" draggable="false">
    </div>

    <div class="etapa" id="etapa-front" hidden>
      <div id="pan">
        <img class="capa-alta" id="f-scene" src="renders/layers/front/front-scene.png" alt="" draggable="false">
        <img class="capa-alta" id="f-back"  src="renders/layers/front/front-back.png"  alt="" draggable="false">
        <div id="plates"></div>
        <img class="capa-alta" id="f-frame" src="renders/layers/front/front-frame.png" alt="" draggable="false">
        <div id="f-zocalo-estirado"><img src="renders/layers/front/front-frame.png" alt="" draggable="false"></div>
        <div id="zona-armario"></div>
      </div>
    </div>

  </div>
</div>

<button id="volver" hidden>&larr; volver (Esc)</button>
<div id="dbg">etapa <b id="d-etapa">room</b> &nbsp; modo <b class="modo" id="d-modo">--</b>
  &nbsp; fila <b id="d-fila">0.00</b> &nbsp; camara <b id="d-pan">0</b> &nbsp; fps <b id="d-fps">--</b></div>

<script>
(function () {
  "use strict";

  // ---- mapeo, medido sobre la imagen alta horneada desde cam-travel ----
  var PPM = 1624.6153;          // px por metro
  var PX_Z0 = 3402.9151;        // fila donde cae world z = 0, en la imagen alta
  var PLACA_H = 357.42;         // alto del estante: 0.22 m (PH_Z) a 1624.6153 px/m
  var ABERT_TOP = 397.3767;     // borde superior de la abertura, origen del recorte
  var ALTO_IMG = 3403;          // alto de la imagen horneada
  var STAGE_W = 2816, STAGE_H = 1536;

  // recorrido de camara: 0 = posicion inicial (limite superior).
  // el maximo pone la linea del piso (z=0, fila PX_Z0) en el borde inferior del
  // cuadro, asi la vista nunca se sale de la habitacion.
  var PAN_MAX = PX_Z0 - STAGE_H;      // 1866.915
  // limite superior: no dejar subir la camara hasta el techo del armario
  // (153.68px, ver #zona-armario) - solo unos 20px de pared por encima.
  var PAN_MIN = 133.68;

  // ---- parametros del loop, mismos que el .blend ----
  // arriba el estante va pegado al dintel; abajo queda junta negra a la vista.
  // eso son 6 estantes + 6 juntas (5 internas + 1 abajo) -> 6*PASO = 1.60
  var L_RECTA = 1.309218, L_TOTAL = 3.466667, N = 13;
  var PASO = 1.60 / 6;          // 0.2666667, junta de 0.0466667
  var Z_TOP = 1.740;            // 1.85 - alto/2: el primero pegado al dintel
  var MARGEN = 0.38;            // tiene que superar al paso

  // ---- giro al entrar en la madera ----
  // sin perspectiva, rotateX proyecta como cos(t): +t y -t son indistinguibles.
  // la direccion se lee por el pivote, no por el signo. anclo el giro en la cara
  // que entra primero en la madera y el resto se pliega hacia ella.
  var PH_Z = 0.220;             // alto del estante
  var Z_AB0 = 0.250;            // base de la abertura
  var R_POLEA = 0.135;
  var ARCO = Math.PI * R_POLEA / 2;         // 0.212058: cuarto de vuelta de la polea
  var S_LIM_SUP = 0;                        // el tope del estante toca el dintel
  var S_LIM_INF = Z_TOP - (Z_AB0 + PH_Z / 2);   // 1.38: su base toca la base
  // la sombra del frente arranca ANTES del arco, sobre el tramo recto. si arrancara
  // recien con el giro no se veria nunca: girando el estante ademas baja y sale por
  // debajo de la abertura, y a -40 grados su cara frontal cae en y 774-855 con el
  // recorte de #plates terminando en 784 — los 10 px que sobran los tapa #f-frame,
  // que va en z-index 4 sobre el 3 de #plates. medido con elementFromPoint.
  var S_PRE = 0.12;

  var K_VIAJE = 40, MS_VIAJE = 650;

  // avanzar = rueda hacia abajo = las placas suben = fase negativa.
  // el arranque es fase 0 y es tope duro.
  var FASE_INICIO = 0;
  var CLAVE = "movievault.lab.paternoster";

  var $ = function (id) { return document.getElementById(id); };
  var etapa = "room";           // room | viaje | front
  var fase = 0, pan = 0;
  var sucio = true, modo = "--";

  function moverFase(delta) {
    var v = fase + delta;
    if (v > FASE_INICIO) v = FASE_INICIO;
    if (v !== fase) { fase = v; sucio = true; }
  }
  function moverPan(delta) {
    var v = pan + delta;
    if (v < PAN_MIN) v = PAN_MIN;
    if (v > PAN_MAX) v = PAN_MAX;
    if (v !== pan) { pan = v; sucio = true; }
  }
  function guardarPos() {
    try { localStorage.setItem(CLAVE, String(fase)); } catch (err) {}
  }
  function recuperarPos() {
    try {
      var v = parseFloat(localStorage.getItem(CLAVE));
      if (isFinite(v) && v <= FASE_INICIO) fase = v;
    } catch (err) {}
  }

  // ---- placas ----
  var placas = [];
  (function () {
    var cont = $("plates");
    for (var i = 0; i < N; i++) {
      var caja = document.createElement("div");
      caja.className = "plate";
      caja.innerHTML = '<div class="cara cara-frente">'
                     +   '<i class="sombra sombra-sup"></i>'
                     +   '<i class="sombra sombra-inf"></i>'
                     + '</div>'
                     + '<div class="cara cara-arriba"></div>'
                     + '<div class="cara cara-abajo"></div>';
      cont.appendChild(caja);
      placas.push({ el: caja, s: 0, visible: null, origen: null, giro: 0, girando: false,
                    som: 0, somAbajo: false });
    }
  })();

  function pintar() {
    $("pan").style.transform = "translate3d(0," + (-pan).toFixed(2) + "px,0)";
    var visibles = 0;
    for (var i = 0; i < N; i++) {
      var p = placas[i];
      var s = (i * PASO + fase) % L_TOTAL;
      if (s < 0) s += L_TOTAL;
      if (s > L_TOTAL - MARGEN) s -= L_TOTAL;
      p.s = s;
      var dentro = s >= -MARGEN && s <= L_RECTA + MARGEN;
      if (dentro !== p.visible) {
        p.el.style.display = dentro ? "block" : "none";
        p.visible = dentro;
      }
      if (dentro) {
        var top = PX_Z0 - (Z_TOP - s) * PPM - PLACA_H / 2 - ABERT_TOP;
        var giro = 0, origen = "50% 50%", som = 0, somAbajo = false;
        if (s < S_LIM_SUP + S_PRE) {
          // sombra-sup deshabilitada a proposito: solo se saca la del arco de
          // arriba, la de abajo (somAbajo) sigue igual.
          if (s < S_LIM_SUP) {
            // sale por arriba: pivota en su cara de arriba, la que ya entro en la madera
            giro = 90 * Math.min(1, (S_LIM_SUP - s) / ARCO);
            origen = "50% 0%";
          }
        } else if (s > S_LIM_INF - S_PRE) {
          som = (s - (S_LIM_INF - S_PRE)) / (S_PRE + ARCO);
          somAbajo = true;
          if (s > S_LIM_INF) {
            // sale por abajo: pivota en su cara de abajo
            giro = -90 * Math.min(1, (s - S_LIM_INF) / ARCO);
            origen = "50% 100%";
          }
        }
        if (origen !== p.origen) { p.el.style.transformOrigin = origen; p.origen = origen; }
        var girando = giro !== 0;
        if (girando !== p.girando) { p.el.classList.toggle("girando", girando); p.girando = girando; }
        som = som <= 0 ? 0 : Math.sqrt(Math.min(1, som));
        if (som !== p.som || somAbajo !== p.somAbajo) {
          var txt = som.toFixed(3);
          p.el.style.setProperty("--som-sup", somAbajo ? "0" : txt);
          p.el.style.setProperty("--som-inf", somAbajo ? txt : "0");
          p.som = som; p.somAbajo = somAbajo;
        }
        p.giro = giro;
        p.el.style.transform = "translate3d(0," + top.toFixed(2) + "px,0)"
          + (giro ? " rotateX(" + giro.toFixed(2) + "deg)" : "");
        if (s >= 0 && s <= L_RECTA) visibles++;
      }
    }
    return visibles;
  }

  // ---- encuadre ----
  var escala = 1;
  function encuadrar() {
    escala = Math.max(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    $("fit").style.transform = "translate(" +
      ((window.innerWidth - STAGE_W * escala) / 2).toFixed(1) + "px," +
      ((window.innerHeight - STAGE_H * escala) / 2).toFixed(1) + "px) scale(" + escala + ")";
  }
  encuadrar();
  window.addEventListener("resize", encuadrar);

  // ---- el cursor decide que se mueve ----
  function sobreArmario(cx, cy) {
    var b = $("zona-armario").getBoundingClientRect();
    return cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom;
  }

  // ---- viaje ----
  // bustea los frames del viaje: se rehacen seguido y el navegador los cachea por
  // nombre (mismo archivo, contenido nuevo) - sin esto se ven mezclados frames viejos
  // y nuevos dentro de la misma secuencia.
  var BUST_VIAJE = Date.now();
  var cuadros = [];
  for (var f = 0; f < K_VIAJE; f++) {
    var im = new Image();
    im.src = "renders/layers/travel/travel-" + (f < 10 ? "0" + f : f) + ".png?v=" + BUST_VIAJE;
    cuadros.push(im);
  }
  function viajar(haciaFront, alTerminar) {
    etapa = "viaje"; modo = "--";
    $("d-etapa").textContent = "viaje";
    $("volver").hidden = true;
    $("etapa-room").hidden = true;
    $("etapa-front").hidden = true;
    $("etapa-viaje").hidden = false;
    var visor = $("cuadro"), ultimo = -1, t0 = performance.now();
    (function paso(t) {
      var u = Math.min((t - t0) / MS_VIAJE, 1);
      var i = Math.round(haciaFront ? u * (K_VIAJE - 1) : (1 - u) * (K_VIAJE - 1));
      if (i !== ultimo) { visor.src = cuadros[i].src; ultimo = i; }
      if (u < 1) { requestAnimationFrame(paso); return; }
      $("etapa-viaje").hidden = true;
      alTerminar();
    })(t0);
  }
  function irAFront() {
    if (etapa !== "room") return;
    viajar(true, function () {
      etapa = "front";
      pan = PAN_MIN;             // el viaje termina en la posicion inicial de camara
      $("etapa-front").hidden = false;
      $("volver").hidden = false;
      $("d-etapa").textContent = "front";
      sucio = true;
    });
  }
  function irARoom() {
    if (etapa !== "front") return;
    guardarPos();               // la posicion de la cadena sobrevive a la salida
    viajar(false, function () {
      etapa = "room";
      $("etapa-room").hidden = false;
      $("d-etapa").textContent = "room";
    });
  }
  $("hotspot").addEventListener("click", irAFront);
  $("volver").addEventListener("click", irARoom);

  // ---- entrada ----
  window.addEventListener("wheel", function (e) {
    if (etapa !== "front") return;
    e.preventDefault();
    if (sobreArmario(e.clientX, e.clientY)) {
      modo = "cadena";
      moverFase(-e.deltaY / (PPM * escala));   // invertido y 1 a 1 con el gesto
    } else {
      modo = "camara";
      moverPan(e.deltaY / escala);             // el paneo sigue al gesto sin invertir
    }
  }, { passive: false });

  var arrastrando = false, ultimoY = 0, arrastreEnArmario = false;
  window.addEventListener("pointerdown", function (e) {
    if (etapa !== "front") return;
    if (e.target.closest("#volver, #dbg")) return;
    arrastrando = true; ultimoY = e.clientY;
    arrastreEnArmario = sobreArmario(e.clientX, e.clientY);
    document.body.style.cursor = "grabbing";
  });
  window.addEventListener("pointermove", function (e) {
    if (!arrastrando) {
      if (etapa === "front") {
        var m = sobreArmario(e.clientX, e.clientY) ? "cadena" : "camara";
        if (m !== modo) { modo = m; sucio = true; }
      }
      return;
    }
    var dy = e.clientY - ultimoY;
    ultimoY = e.clientY;
    if (arrastreEnArmario) moverFase(-dy / (PPM * escala));
    else moverPan(-dy / escala);
  });
  window.addEventListener("pointerup", function () {
    arrastrando = false; document.body.style.cursor = "";
  });

  // unica tecla: Esc sale de la escena de la estanteria
  window.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || etapa !== "front") return;
    e.preventDefault();
    irARoom();
  });

  // ---- loop ----
  var t0 = performance.now(), acum = 0, marcos = 0;
  (function tick(t) {
    var dt = (t - t0) / 1000; t0 = t;
    if (sucio) {
      pintar();
      $("d-fila").textContent = (-fase / PASO).toFixed(2)
        + (fase >= FASE_INICIO ? " INICIO" : "");
      $("d-pan").textContent = pan.toFixed(0) + "/" + PAN_MAX.toFixed(0)
        + (pan <= PAN_MIN ? " TOPE" : pan >= PAN_MAX ? " FONDO" : "");
      $("d-modo").textContent = etapa === "front" ? modo : "--";
      sucio = false;
    }
    acum += dt; marcos++;
    if (acum >= 0.4) { $("d-fps").textContent = Math.round(marcos / acum); acum = 0; marcos = 0; }
    requestAnimationFrame(tick);
  })(t0);
  recuperarPos();
  pintar();

  // superficie de inspeccion: rAF no corre con la pestaña oculta
  window.LAB = {
    pintar: pintar, placas: placas,
    getEtapa: function () { return etapa; },
    setEtapa: function (v) { etapa = v; },
    setFase: function (v) { fase = Math.min(v, FASE_INICIO); return pintar(); },
    getFase: function () { return fase; },
    setPan: function (v) { pan = Math.max(PAN_MIN, Math.min(v, PAN_MAX)); return pintar(); },
    getPan: function () { return pan; },
    getModo: function () { return modo; },
    rueda: function (dy, cx, cy) {
      if (etapa !== "front") return false;
      if (sobreArmario(cx, cy)) { modo = "cadena"; moverFase(-dy / (PPM * escala)); }
      else { modo = "camara"; moverPan(dy / escala); }
      pintar(); return true;
    },
    sobreArmario: sobreArmario,
    getEscala: function () { return escala; },
    guardarPos: guardarPos, recuperarPos: recuperarPos,
    leerGuardado: function () { try { return localStorage.getItem(CLAVE); } catch (e) { return null; } },
    borrarGuardado: function () { try { localStorage.removeItem(CLAVE); } catch (e) {} },
    cuadros: cuadros,
    ctes: { PPM: PPM, PX_Z0: PX_Z0, PLACA_H: PLACA_H, ABERT_TOP: ABERT_TOP,
            ALTO_IMG: ALTO_IMG, PAN_MAX: PAN_MAX, PAN_MIN: PAN_MIN, FASE_INICIO: FASE_INICIO,
            L_RECTA: L_RECTA, L_TOTAL: L_TOTAL, N: N, PASO: PASO,
            Z_TOP: Z_TOP, MARGEN: MARGEN, STAGE_W: STAGE_W, STAGE_H: STAGE_H }
  };
})();
</script>
