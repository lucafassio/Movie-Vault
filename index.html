<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>movievault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&family=VT323&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/computer.css">
  <link rel="stylesheet" href="css/case.css">
</head>
<body>
  <div id="viewport">
    <div id="camera">
      <div id="stage">

        <!-- fondo -->
        <div class="wall"></div>
        <div class="floor">
          <div class="plank plank-1"></div>
          <div class="plank plank-2"></div>
          <div class="plank plank-3"></div>
        </div>
        <div class="rug">
          <div class="rug-border"></div>
          <div class="rug-medallion"></div>
        </div>

        <!-- guirnalda de luces -->
        <svg class="string-lights" viewBox="0 0 1440 130" width="1440" height="130" shape-rendering="crispEdges">
          <path d="M0,30 Q180,95 360,55 Q540,15 720,75 Q900,130 1080,60 Q1260,10 1440,55" fill="none" stroke="#241a20" stroke-width="5"/>
          <g class="bulbs">
            <rect x="112" y="64" width="14" height="18" rx="4"/>
            <rect x="252" y="80" width="14" height="18" rx="4"/>
            <rect x="398" y="48" width="14" height="18" rx="4"/>
            <rect x="540" y="38" width="14" height="18" rx="4"/>
            <rect x="682" y="66" width="14" height="18" rx="4"/>
            <rect x="822" y="98" width="14" height="18" rx="4"/>
            <rect x="962" y="86" width="14" height="18" rx="4"/>
            <rect x="1104" y="48" width="14" height="18" rx="4"/>
            <rect x="1244" y="26" width="14" height="18" rx="4"/>
            <rect x="1372" y="42" width="14" height="18" rx="4"/>
          </g>
        </svg>

        <!-- estante flotante arriba a la izquierda -->
        <div class="wallshelf">
          <div class="wallshelf-board"></div>
          <div class="wallshelf-books">
            <span style="--bh:52px;--bw:16px;--bc:#8a4a3a"></span>
            <span style="--bh:60px;--bw:14px;--bc:#3f6a52"></span>
            <span style="--bh:46px;--bw:18px;--bc:#b08a3e"></span>
            <span style="--bh:56px;--bw:13px;--bc:#54628f"></span>
            <span style="--bh:50px;--bw:15px;--bc:#7a4a68"></span>
            <span class="lean" style="--bh:54px;--bw:14px;--bc:#4a6a7a"></span>
          </div>
          <svg class="wallshelf-ivy" viewBox="0 0 90 150" width="90" height="150">
            <path d="M20,0 Q10,50 26,90 Q34,120 20,148" fill="none" stroke="#3f6a3a" stroke-width="6"/>
            <circle cx="14" cy="34" r="9" fill="#4c7d44"/>
            <circle cx="30" cy="62" r="9" fill="#3f6a3a"/>
            <circle cx="18" cy="96" r="9" fill="#4c7d44"/>
            <circle cx="30" cy="126" r="9" fill="#3f6a3a"/>
          </svg>
        </div>

        <!-- posters y papeles en la pared izquierda -->
        <div class="poster-space">
          <div class="pp-planet pp-planet-1"></div>
          <div class="pp-planet pp-planet-2"></div>
          <div class="pp-stars"></div>
        </div>
        <div class="pin-card pin-card-photo"><div class="pin"></div></div>
        <div class="pin-card pin-card-pyramid"><div class="pin"></div><div class="pyr"></div></div>
        <div class="pin-card pin-card-moon"><div class="pin"></div><div class="mini-moon"></div></div>

        <!-- ventana con persiana y lluvia -->
        <div id="window-unit">
          <div class="win-night">
            <div class="win-moon"></div>
            <canvas id="rain-canvas" width="1140" height="880"></canvas>
          </div>
          <div class="win-cross"></div>
          <div class="blind">
            <div class="blind-slat"></div>
            <div class="blind-slat"></div>
            <div class="blind-slat"></div>
            <div class="blind-slat"></div>
            <div class="blind-slat"></div>
            <div class="blind-rail"></div>
            <div class="blind-cord"></div>
          </div>
          <div class="win-frame"></div>
          <div class="win-sill"></div>
        </div>

        <!-- escritorio -->
        <div class="desk">
          <div class="desk-surface"></div>
          <div class="desk-edge"></div>
          <div class="desk-pedestal desk-pedestal-left">
            <div class="drawer"><span></span></div>
            <div class="drawer"><span></span></div>
            <div class="drawer"><span></span></div>
          </div>
          <div class="desk-pedestal desk-pedestal-right">
            <div class="drawer"><span></span></div>
            <div class="drawer"><span></span></div>
            <div class="drawer"><span></span></div>
          </div>
        </div>

        <!-- torre de pc debajo del escritorio -->
        <div class="tower">
          <div class="tower-slot"></div>
          <div class="tower-slot tower-slot-2"></div>
          <div class="tower-btn"></div>
          <div class="tower-led"></div>
        </div>

        <!-- lampara de escritorio -->
        <div class="lamp">
          <svg viewBox="0 0 150 330" width="150" height="330" shape-rendering="crispEdges">
            <rect x="30" y="300" width="90" height="22" rx="4" fill="#3a2c22" stroke="#241a20" stroke-width="5"/>
            <rect x="66" y="120" width="16" height="186" fill="#7a5a3a" stroke="#241a20" stroke-width="5"/>
            <polygon points="30,120 120,120 138,44 12,44" fill="#f2a54a" stroke="#241a20" stroke-width="6"/>
            <polygon points="34,116 116,116 126,66 24,66" fill="#ffcf7d"/>
            <rect x="52" y="118" width="46" height="12" fill="#ffe7b0"/>
          </svg>
          <div class="lamp-halo"></div>
        </div>

        <!-- pila de libros y planta chica sobre el escritorio -->
        <div class="desk-books">
          <span style="--bw:86px;--bc:#54628f"></span>
          <span style="--bw:74px;--bc:#8a4a3a"></span>
          <span style="--bw:80px;--bc:#b08a3e"></span>
        </div>
        <div class="desk-plant">
          <svg viewBox="0 0 70 90" width="70" height="90" shape-rendering="crispEdges">
            <path d="M35,52 Q18,34 22,10 Q34,30 35,48 Q40,24 54,14 Q50,40 38,52 Z" fill="#4c7d44" stroke="#2e5226" stroke-width="4"/>
            <polygon points="14,54 56,54 50,86 20,86" fill="#b06a3a" stroke="#241a20" stroke-width="5"/>
            <rect x="14" y="52" width="42" height="10" fill="#c97c48" stroke="#241a20" stroke-width="5"/>
          </svg>
        </div>

        <!-- computadora crt, zona interactiva -->
        <div id="desk-zone" class="interactive" role="button" tabindex="0" aria-label="usar la computadora">
          <div class="crt">
            <div class="crt-body"></div>
            <div class="crt-screen-frame">
              <div class="monitor-screen" id="monitor-screen">
                <div class="crt-scanlines"></div>
              </div>
            </div>
            <div class="crt-chin">
              <span class="crt-led"></span>
              <span class="crt-badge"></span>
            </div>
            <div class="crt-foot"></div>
          </div>
          <div class="keyboard">
            <div class="key-row"></div>
            <div class="key-row"></div>
            <div class="key-row key-row-space"></div>
          </div>
          <div class="mouse"></div>
          <div class="zone-label zone-label-desk">computadora</div>
        </div>

        <!-- taza -->
        <div class="mug"><div class="mug-handle"></div><div class="mug-steam"></div></div>

        <!-- impresora sobre el escritorio -->
        <div class="printer">
          <div class="printer-top"></div>
          <div class="printer-body"></div>
          <div class="printer-slot" id="printer-slot"></div>
          <div class="printer-btn"></div>
          <div class="printer-light"></div>
        </div>

        <!-- silla de escritorio, decorativa, por delante del escritorio -->
        <div class="chair">
          <svg viewBox="0 0 340 560" width="340" height="560" shape-rendering="crispEdges">
            <rect x="150" y="330" width="34" height="120" fill="#2a222c" stroke="#241a20" stroke-width="5"/>
            <path d="M167,470 L60,530 M167,470 L167,545 M167,470 L274,530" stroke="#2a222c" stroke-width="16" stroke-linecap="round"/>
            <circle cx="60" cy="534" r="12" fill="#241a20"/>
            <circle cx="167" cy="549" r="12" fill="#241a20"/>
            <circle cx="274" cy="534" r="12" fill="#241a20"/>
            <rect x="52" y="250" width="230" height="96" rx="18" fill="#c9682e" stroke="#241a20" stroke-width="6"/>
            <rect x="66" y="264" width="202" height="30" rx="10" fill="#dd7c3e"/>
            <rect x="76" y="20" width="184" height="250" rx="22" fill="#c9682e" stroke="#241a20" stroke-width="6"/>
            <rect x="94" y="44" width="148" height="150" rx="14" fill="#dd7c3e"/>
            <rect x="150" y="255" width="36" height="40" fill="#a8531f"/>
          </svg>
        </div>

        <!-- estanteria, zona interactiva -->
        <div id="shelf-zone" class="interactive" role="button" tabindex="0" aria-label="ver la coleccion">
          <div class="bookcase">
            <div class="bookcase-top">
              <div class="top-pot top-pot-1"><svg viewBox="0 0 60 78" width="60" height="78"><path d="M30,40 Q16,26 20,6 Q30,22 30,38 Q34,16 46,10 Q44,32 32,42 Z" fill="#4c7d44" stroke="#2e5226" stroke-width="4"/><polygon points="12,42 48,42 44,72 16,72" fill="#b06a3a" stroke="#241a20" stroke-width="4"/></svg></div>
              <div class="top-books">
                <span style="--bh:44px;--bw:13px;--bc:#7a4a68"></span>
                <span style="--bh:52px;--bw:15px;--bc:#3f6a52"></span>
                <span style="--bh:48px;--bw:14px;--bc:#54628f"></span>
              </div>
              <div class="top-box"></div>
              <div class="top-pot top-pot-2"><svg viewBox="0 0 60 70" width="60" height="70"><path d="M18,36 Q14,14 30,4 Q46,14 42,36 Z" fill="#4c7d44" stroke="#2e5226" stroke-width="4"/><polygon points="14,36 46,36 42,64 18,64" fill="#8a5a68" stroke="#241a20" stroke-width="4"/></svg></div>
            </div>
            <div class="shelf-row" data-row="0"><div class="spine-strip"></div></div>
            <div class="shelf-board"></div>
            <div class="shelf-row" data-row="1"><div class="spine-strip"></div></div>
            <div class="shelf-board"></div>
            <div class="shelf-row shelf-row-decor">
              <div class="succulent succulent-1"><svg viewBox="0 0 70 96" width="70" height="96"><path d="M35,52 L20,20 M35,52 L35,10 M35,52 L50,20" stroke="#4c7d44" stroke-width="9" stroke-linecap="round"/><polygon points="16,54 54,54 49,90 21,90" fill="#b06a3a" stroke="#241a20" stroke-width="4"/></svg></div>
              <div class="mini-frame"></div>
              <div class="succulent succulent-2"><svg viewBox="0 0 80 90" width="80" height="90"><circle cx="28" cy="36" r="16" fill="#4c7d44" stroke="#2e5226" stroke-width="4"/><circle cx="48" cy="30" r="12" fill="#5d9152" stroke="#2e5226" stroke-width="4"/><polygon points="18,50 62,50 56,84 24,84" fill="#8a5a68" stroke="#241a20" stroke-width="4"/></svg></div>
            </div>
            <div class="shelf-board"></div>
            <div class="shelf-row" data-row="2">
              <div class="spine-strip"></div>
              <div class="lean-books">
                <span style="--bh:120px;--bw:26px;--bc:#54628f"></span>
                <span style="--bh:132px;--bw:24px;--bc:#8a4a3a"></span>
                <span class="lean" style="--bh:126px;--bw:24px;--bc:#3f6a52"></span>
              </div>
            </div>
          </div>
          <div class="zone-label zone-label-shelf">coleccion</div>
        </div>

        <!-- poster de la luna a la derecha del estante -->
        <div class="poster-moon">
          <div class="pm-moon"></div>
          <div class="pm-star pm-star-1"></div>
          <div class="pm-star pm-star-2"></div>
          <div class="pm-star pm-star-3"></div>
          <span class="pm-title">NOCTURNA</span>
        </div>

        <!-- borde de la cama abajo a la derecha -->
        <div class="bed">
          <div class="bed-pillow"></div>
          <div class="bed-blanket"></div>
          <div class="bed-stripe"></div>
        </div>

        <!-- planta grande de piso a la izquierda -->
        <div class="floor-plant">
          <svg viewBox="0 0 170 300" width="170" height="300">
            <path d="M85,180 Q40,120 50,40 Q80,110 85,170 Q95,90 140,60 Q125,140 95,178 Q60,150 30,150 Q60,185 82,184 Z" fill="#4c7d44" stroke="#2e5226" stroke-width="5"/>
            <polygon points="45,185 125,185 115,280 55,280" fill="#b06a3a" stroke="#241a20" stroke-width="6"/>
            <rect x="45" y="182" width="80" height="14" fill="#c97c48" stroke="#241a20" stroke-width="6"/>
          </svg>
        </div>

        <!-- capas de luz -->
        <div class="lamp-glow"></div>
        <div class="ambient-warm"></div>
        <div class="vignette"></div>
        <div class="sparkle"></div>
      </div>
    </div>

    <!-- chrome fijo de la app -->
    <header class="app-chrome">
      <span class="app-logo">&#128193; movievault</span>
      <span class="app-icons"><span class="app-ico">&#9993;</span><span class="app-ico">&#9881;</span></span>
    </header>

    <button id="back-btn" class="ui-btn" hidden>&larr; volver</button>
    <div id="case-overlay" hidden></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/rain.js"></script>
  <script src="js/shelf.js"></script>
  <script src="js/computer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
