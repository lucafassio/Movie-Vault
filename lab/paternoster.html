<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>movievault — lab: escena</title>
<style>
  :root {
    --bg: #0d0b13;
    --panel: rgba(20, 18, 28, 0.88);
    --line: #3a3550;
    --ink: #cfcadd;
    --accent: #d2783c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  img { user-select: none; }

  /* un solo stage de 2816x1536: el campo de vision no cambia nunca */
  #fit { position: absolute; transform-origin: 0 0; }
  #stage { position: relative; width: 2816px; height: 1536px; overflow: hidden; }
  .etapa[hidden] { display: none; }
  .layer { position: absolute; top: 0; left: 0; width: 2816px; height: 1536px; }

  #hotspot {
    position: absolute; left: 1697px; top: 177px; width: 830px; height: 1252px;
    border: 6px solid transparent; border-radius: 10px;
    background: transparent; cursor: pointer; padding: 0; z-index: 9;
  }
  #hotspot:hover, #hotspot:focus-visible {
    border-color: rgba(210, 120, 60, .85);
    background: rgba(210, 120, 60, .10);
    outline: none;
  }

  /* --- etapa frontal ---
     las capas se hornean en un canvas alto (2816x2648) que cubre todo el recorrido
     vertical de camara. como la camara es ortografica, moverla en Z es una
     traslacion pura de pixeles: el paneo es un translateY, no un re-render. */
  #pan { position: absolute; top: 0; left: 0; width: 2816px; height: 2648px;
         will-change: transform; }
  .capa-alta { position: absolute; top: 0; left: 0; width: 2816px; height: 2648px; }
  #f-scene { z-index: 1; }
  #f-back  { z-index: 2; }
  #plates {
    position: absolute; overflow: hidden; z-index: 3;
    left: 798.04px; top: 459.69px; width: 1219.93px; height: 1626.57px;
  }
  #f-frame { z-index: 4; }
  /* sonda de geometria: define que cuenta como "encima del armario" */
  #zona-armario {
    position: absolute; z-index: 5; pointer-events: none;
    left: 747.21px; top: 307.20px; width: 1321.59px; height: 2033.21px;
  }
  .plate {
    position: absolute; top: 0; left: 46.96px;   /* 845 del sprite - 798.04 de la abertura */
    width: 1126px; height: 233px;
    will-change: transform; backface-visibility: hidden;
  }

  #dbg {
    position: fixed; bottom: 10px; left: 10px; z-index: 20;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 9px; color: #8b85a3; font-variant-numeric: tabular-nums;
  }
  #dbg b { color: var(--ink); font-weight: 600; }
  #dbg .modo { color: var(--accent); }
  #volver {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 13px; cursor: pointer; font: inherit;
  }
  #volver:hover { border-color: var(--accent); }
  #volver[hidden] { display: none; }
</style>
</head>
<body>

<div id="fit">
  <div id="stage">

    <div class="etapa" id="etapa-room">
      <img class="layer" src="../renders/layers/room/room.png" alt="" draggable="false">
      <button id="hotspot" title="ir a la estanteria"></button>
    </div>

    <div class="etapa" id="etapa-viaje" hidden>
      <img class="layer" id="cuadro" alt="" draggable="false">
    </div>

    <div class="etapa" id="etapa-front" hidden>
      <div id="pan">
        <img class="capa-alta" id="f-scene" src="../renders/layers/front/front-scene.png" alt="" draggable="false">
        <img class="capa-alta" id="f-back"  src="../renders/layers/front/front-back.png"  alt="" draggable="false">
        <div id="plates"></div>
        <img class="capa-alta" id="f-frame" src="../renders/layers/front/front-frame.png" alt="" draggable="false">
        <div id="zona-armario"></div>
      </div>
    </div>

  </div>
</div>

<button id="volver" hidden>&larr; volver (Esc)</button>
<div id="dbg">etapa <b id="d-etapa">room</b> &nbsp; modo <b class="modo" id="d-modo">--</b>
  &nbsp; fila <b id="d-fila">0.00</b> &nbsp; camara <b id="d-pan">0</b> &nbsp; fps <b id="d-fps">--</b></div>

<script>
(function () {
  "use strict";

  // ---- mapeo, medido sobre la imagen alta horneada desde cam-travel ----
  var PPM = 1016.6065;          // px por metro
  var PX_Z0 = 2340.4130;        // fila donde cae world z = 0, en la imagen alta
  var SPRITE_H = 233;
  var ABERT_TOP = 459.69;       // borde superior de la abertura, origen del recorte
  var ALTO_IMG = 2648;          // alto de la imagen horneada
  var STAGE_W = 2816, STAGE_H = 1536;

  // recorrido de camara: 0 = posicion inicial (limite superior).
  // el maximo pone la linea del piso (z=0, fila PX_Z0) en el borde inferior del
  // cuadro, asi la vista nunca se sale de la habitacion.
  var PAN_MAX = PX_Z0 - STAGE_H;      // 804.413

  // ---- parametros del loop, mismos que el .blend ----
  // arriba el estante va pegado al dintel; abajo queda junta negra a la vista.
  // eso son 6 estantes + 6 juntas (5 internas + 1 abajo) -> 6*PASO = 1.60
  var L_RECTA = 1.309218, L_TOTAL = 3.466667, N = 13;
  var PASO = 1.60 / 6;          // 0.2666667, junta de 0.0466667
  var Z_TOP = 1.740;            // 1.85 - alto/2: el primero pegado al dintel
  var MARGEN = 0.38;            // tiene que superar al paso

  var K_VIAJE = 24, MS_VIAJE = 820;

  // avanzar = rueda hacia abajo = las placas suben = fase negativa.
  // el arranque es fase 0 y es tope duro.
  var FASE_INICIO = 0;
  var CLAVE = "movievault.lab.paternoster";

  var $ = function (id) { return document.getElementById(id); };
  var etapa = "room";           // room | viaje | front
  var fase = 0, pan = 0;
  var sucio = true, modo = "--";

  function moverFase(delta) {
    var v = fase + delta;
    if (v > FASE_INICIO) v = FASE_INICIO;
    if (v !== fase) { fase = v; sucio = true; }
  }
  function moverPan(delta) {
    var v = pan + delta;
    if (v < 0) v = 0;
    if (v > PAN_MAX) v = PAN_MAX;
    if (v !== pan) { pan = v; sucio = true; }
  }
  function guardarPos() {
    try { localStorage.setItem(CLAVE, String(fase)); } catch (err) {}
  }
  function recuperarPos() {
    try {
      var v = parseFloat(localStorage.getItem(CLAVE));
      if (isFinite(v) && v <= FASE_INICIO) fase = v;
    } catch (err) {}
  }

  // ---- placas ----
  var placas = [];
  (function () {
    var cont = $("plates");
    for (var i = 0; i < N; i++) {
      var img = document.createElement("img");
      img.className = "plate";
      img.src = "../renders/layers/front/front-platform-sprite.png";
      img.alt = ""; img.draggable = false;
      cont.appendChild(img);
      placas.push({ el: img, s: 0, visible: null });
    }
  })();

  function pintar() {
    $("pan").style.transform = "translate3d(0," + (-pan).toFixed(2) + "px,0)";
    var visibles = 0;
    for (var i = 0; i < N; i++) {
      var p = placas[i];
      var s = (i * PASO + fase) % L_TOTAL;
      if (s < 0) s += L_TOTAL;
      if (s > L_TOTAL - MARGEN) s -= L_TOTAL;
      p.s = s;
      var dentro = s >= -MARGEN && s <= L_RECTA + MARGEN;
      if (dentro !== p.visible) {
        p.el.style.display = dentro ? "block" : "none";
        p.visible = dentro;
      }
      if (dentro) {
        var top = PX_Z0 - (Z_TOP - s) * PPM - SPRITE_H / 2 - ABERT_TOP;
        p.el.style.transform = "translate3d(0," + top.toFixed(2) + "px,0)";
        if (s >= 0 && s <= L_RECTA) visibles++;
      }
    }
    return visibles;
  }

  // ---- encuadre ----
  var escala = 1;
  function encuadrar() {
    escala = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H) * 0.96;
    $("fit").style.transform = "translate(" +
      ((window.innerWidth - STAGE_W * escala) / 2).toFixed(1) + "px," +
      ((window.innerHeight - STAGE_H * escala) / 2).toFixed(1) + "px) scale(" + escala + ")";
  }
  encuadrar();
  window.addEventListener("resize", encuadrar);

  // ---- el cursor decide que se mueve ----
  function sobreArmario(cx, cy) {
    var b = $("zona-armario").getBoundingClientRect();
    return cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom;
  }

  // ---- viaje ----
  var cuadros = [];
  for (var f = 0; f < K_VIAJE; f++) {
    var im = new Image();
    im.src = "../renders/layers/travel/travel-" + (f < 10 ? "0" + f : f) + ".png";
    cuadros.push(im);
  }
  function viajar(haciaFront, alTerminar) {
    etapa = "viaje"; modo = "--";
    $("d-etapa").textContent = "viaje";
    $("volver").hidden = true;
    $("etapa-room").hidden = true;
    $("etapa-front").hidden = true;
    $("etapa-viaje").hidden = false;
    var visor = $("cuadro"), ultimo = -1, t0 = performance.now();
    (function paso(t) {
      var u = Math.min((t - t0) / MS_VIAJE, 1);
      var i = Math.round(haciaFront ? u * (K_VIAJE - 1) : (1 - u) * (K_VIAJE - 1));
      if (i !== ultimo) { visor.src = cuadros[i].src; ultimo = i; }
      if (u < 1) { requestAnimationFrame(paso); return; }
      $("etapa-viaje").hidden = true;
      alTerminar();
    })(t0);
  }
  function irAFront() {
    if (etapa !== "room") return;
    viajar(true, function () {
      etapa = "front";
      pan = 0;                  // el viaje termina en la posicion inicial de camara
      $("etapa-front").hidden = false;
      $("volver").hidden = false;
      $("d-etapa").textContent = "front";
      sucio = true;
    });
  }
  function irARoom() {
    if (etapa !== "front") return;
    guardarPos();               // la posicion de la cadena sobrevive a la salida
    viajar(false, function () {
      etapa = "room";
      $("etapa-room").hidden = false;
      $("d-etapa").textContent = "room";
    });
  }
  $("hotspot").addEventListener("click", irAFront);
  $("volver").addEventListener("click", irARoom);

  // ---- entrada ----
  window.addEventListener("wheel", function (e) {
    if (etapa !== "front") return;
    e.preventDefault();
    if (sobreArmario(e.clientX, e.clientY)) {
      modo = "cadena";
      moverFase(-e.deltaY / (PPM * escala));   // invertido y 1 a 1 con el gesto
    } else {
      modo = "camara";
      moverPan(e.deltaY / escala);             // el paneo sigue al gesto sin invertir
    }
  }, { passive: false });

  var arrastrando = false, ultimoY = 0, arrastreEnArmario = false;
  window.addEventListener("pointerdown", function (e) {
    if (etapa !== "front") return;
    if (e.target.closest("#volver, #dbg")) return;
    arrastrando = true; ultimoY = e.clientY;
    arrastreEnArmario = sobreArmario(e.clientX, e.clientY);
    document.body.style.cursor = "grabbing";
  });
  window.addEventListener("pointermove", function (e) {
    if (!arrastrando) {
      if (etapa === "front") {
        var m = sobreArmario(e.clientX, e.clientY) ? "cadena" : "camara";
        if (m !== modo) { modo = m; sucio = true; }
      }
      return;
    }
    var dy = e.clientY - ultimoY;
    ultimoY = e.clientY;
    if (arrastreEnArmario) moverFase(-dy / (PPM * escala));
    else moverPan(-dy / escala);
  });
  window.addEventListener("pointerup", function () {
    arrastrando = false; document.body.style.cursor = "";
  });

  // unica tecla: Esc sale de la escena de la estanteria
  window.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || etapa !== "front") return;
    e.preventDefault();
    irARoom();
  });

  // ---- loop ----
  var t0 = performance.now(), acum = 0, marcos = 0;
  (function tick(t) {
    var dt = (t - t0) / 1000; t0 = t;
    if (sucio) {
      pintar();
      $("d-fila").textContent = (-fase / PASO).toFixed(2)
        + (fase >= FASE_INICIO ? " INICIO" : "");
      $("d-pan").textContent = pan.toFixed(0) + "/" + PAN_MAX.toFixed(0)
        + (pan <= 0 ? " TOPE" : pan >= PAN_MAX ? " FONDO" : "");
      $("d-modo").textContent = etapa === "front" ? modo : "--";
      sucio = false;
    }
    acum += dt; marcos++;
    if (acum >= 0.4) { $("d-fps").textContent = Math.round(marcos / acum); acum = 0; marcos = 0; }
    requestAnimationFrame(tick);
  })(t0);
  recuperarPos();
  pintar();

  // superficie de inspeccion: rAF no corre con la pestaña oculta
  window.LAB = {
    pintar: pintar, placas: placas,
    getEtapa: function () { return etapa; },
    setEtapa: function (v) { etapa = v; },
    setFase: function (v) { fase = Math.min(v, FASE_INICIO); return pintar(); },
    getFase: function () { return fase; },
    setPan: function (v) { pan = Math.max(0, Math.min(v, PAN_MAX)); return pintar(); },
    getPan: function () { return pan; },
    getModo: function () { return modo; },
    rueda: function (dy, cx, cy) {
      if (etapa !== "front") return false;
      if (sobreArmario(cx, cy)) { modo = "cadena"; moverFase(-dy / (PPM * escala)); }
      else { modo = "camara"; moverPan(dy / escala); }
      pintar(); return true;
    },
    sobreArmario: sobreArmario,
    getEscala: function () { return escala; },
    guardarPos: guardarPos, recuperarPos: recuperarPos,
    leerGuardado: function () { try { return localStorage.getItem(CLAVE); } catch (e) { return null; } },
    borrarGuardado: function () { try { localStorage.removeItem(CLAVE); } catch (e) {} },
    cuadros: cuadros,
    ctes: { PPM: PPM, PX_Z0: PX_Z0, SPRITE_H: SPRITE_H, ABERT_TOP: ABERT_TOP,
            ALTO_IMG: ALTO_IMG, PAN_MAX: PAN_MAX, FASE_INICIO: FASE_INICIO,
            L_RECTA: L_RECTA, L_TOTAL: L_TOTAL, N: N, PASO: PASO,
            Z_TOP: Z_TOP, MARGEN: MARGEN, STAGE_W: STAGE_W, STAGE_H: STAGE_H }
  };
})();
</script>
</body>
</html>
