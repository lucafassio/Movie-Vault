<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>movievault — prueba de api omdb</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #14161a; color: #e6e6e6; font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #8a8f98; }
  section { border: 1px solid #2a2e35; padding: 14px; margin-bottom: 16px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: #8a8f98; text-transform: uppercase; letter-spacing: 1px; }
  input, button { font: inherit; background: #1c1f25; color: #e6e6e6; border: 1px solid #3a3f48; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { background: #262a31; }
  #results div { padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #23262c; }
  #results div:hover { background: #1c1f25; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #2a2e35; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { color: #8a8f98; font-weight: normal; }
  pre { background: #0f1114; border: 1px solid #2a2e35; padding: 10px; overflow: auto; max-height: 320px; white-space: pre-wrap; word-break: break-word; }
  .ficha { display: flex; gap: 14px; align-items: flex-start; }
  .ficha img { width: 140px; border: 1px solid #2a2e35; flex: 0 0 auto; }
  .ficha .datos { flex: 1; min-width: 0; }
  .ok { color: #6bd27a; }
  .warn { color: #e0b341; }
  .bad { color: #e06c6c; }
  .note { color: #8a8f98; }
</style>
</head>
<body>

<h1>movievault — prueba de api omdb</h1>
<p class="sub">pagina descartable: solo comprueba que se puede buscar en omdb y extraer los campos que usa la coleccion</p>

<section>
  <h2>api key</h2>
  <input id="key" type="text" size="30" placeholder="pegar la key de omdb">
  <button id="save-key">guardar</button>
  <button id="clear-cache">limpiar cache</button>
  <span id="key-status" class="note"></span>
</section>

<section>
  <h2>buscador</h2>
  <input id="query" type="search" size="40" placeholder="titulo de pelicula o serie">
  <button id="run-search">buscar</button>
  <div id="results"></div>
</section>

<section>
  <h2>ficha mapeada</h2>
  <div id="mapped" class="note">elegi un resultado de la lista</div>
  <h2 style="margin-top:14px">json crudo de omdb</h2>
  <pre id="raw"></pre>
</section>

<section>
  <h2>asserts contra la coleccion</h2>
  <button id="run-asserts">correr asserts</button>
  <div id="summary" class="note">sin correr</div>
  <div id="tests-table"></div>
</section>

<!-- config.local.js esta fuera de git y puede no existir en un clon limpio: el 404 es ruidoso pero no rompe nada, MV.config queda undefined y se avisa en pantalla -->
<script>
  // el server estatico local no manda cabeceras de no-cache, sin esta firma el browser se queda con la version vieja de los scripts y hay que recargar a mano despues de cada edicion
  window.MV_BUST = Date.now();
  ["js/config.local.js", "js/omdb.js", "js/tmdb.js", "js/omdb-testdata.js", "js/movie-source.js"].forEach(function (src) {
    const script = document.createElement("script");
    script.src = src + "?v=" + window.MV_BUST;
    // async false mantiene el orden de ejecucion, que importa porque los modulos se registran en el namespace MV
    script.async = false;
    document.body.appendChild(script);
  });
</script>
<script>
(function () {
  const FIELDS = ["title", "releaseDate", "duration", "imdbRating", "parental", "genres", "country", "actors"];

  const keyInput = document.getElementById("key");
  const keyStatus = document.getElementById("key-status");
  const queryInput = document.getElementById("query");
  const resultsList = document.getElementById("results");
  const mappedCard = document.getElementById("mapped");
  const rawJson = document.getElementById("raw");

  function escapeHtml(text) {
    // la ficha se arma con innerHTML y los titulos vienen de una api: escapamos para no inyectar markup ajeno en la pagina
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // la key puede venir de js/config.local.js (fuera de git) o escribirse a mano en el input: el config solo gana cuando todavia no hay nada guardado, asi lo tipeado a mano no se pisa en cada reload
  function seedKeyFromConfig() {
    if (MV.omdb.getKey()) {
      return;
    }
    if (MV.config && MV.config.has("OMDB_API_KEY")) {
      MV.omdb.setKey(MV.config.get("OMDB_API_KEY"));
    }
  }

  function paintKeyStatus() {
    if (!MV.config) {
      keyStatus.textContent = "falta js/config.local.js: no hay ninguna key";
      return;
    }
    // solo se chequea lo que el pipeline usa de verdad: TMDB_READ_ACCESS_TOKEN esta en el config pero este cliente va por api_key
    if (!MV.config.has("TMDB_API_KEY")) {
      keyStatus.textContent = "falta TMDB_API_KEY en config.local.js: la busqueda no va a andar";
      return;
    }
    const omdbKey = MV.omdb.getKey();
    keyStatus.textContent = "tmdb lista, omdb " + (omdbKey ? "lista (" + omdbKey.slice(0, 3) + "...)" : "sin key, el rating va a quedar vacio");
  }

  function showError(err) {
    mappedCard.innerHTML = '<span class="bad">' + escapeHtml(err.message) + "</span>";
    rawJson.textContent = "";
  }

  function paintCard(mapped, raw) {
    const rows = FIELDS.map(function (field) {
      // imdbRating puede venir null cuando la pelicula todavia no tiene puntaje y String(null) escribe "null" en la tabla
      const rawValue = mapped[field];
      const value = rawValue === null || rawValue === undefined ? "-" : (Array.isArray(rawValue) ? rawValue.join(", ") : String(rawValue));
      return "<tr><th>" + field + "</th><td>" + escapeHtml(value) + "</td></tr>";
    });
    rows.push('<tr><th>imdbLink</th><td><a href="' + escapeHtml(mapped.imdbLink) + '" target="_blank" rel="noopener">' + escapeHtml(mapped.imdbLink) + "</a></td></tr>");
    const poster = mapped.poster ? '<img src="' + escapeHtml(mapped.poster) + '" alt="portada">' : "";
    mappedCard.innerHTML = '<div class="ficha">' + poster + '<div class="datos"><table>' + rows.join("") + "</table></div></div>";
    rawJson.textContent = JSON.stringify(raw, null, 2);
  }

  function paintResults(items) {
    if (!items.length) {
      resultsList.innerHTML = '<div class="note">sin resultados</div>';
      return;
    }
    resultsList.innerHTML = "";
    items.forEach(function (item) {
      const row = document.createElement("div");
      row.textContent = item.title + "  (" + item.year + ")";
      row.addEventListener("click", function () {
        mappedCard.textContent = "cargando...";
        MV.movieSource.getMovie(item.tmdbId).then(function (result) {
          // se pinta con lo de tmdb sin esperar a omdb: si omdb tarda o esta caido la ficha ya esta en pantalla
          paintCard(result.mapped, result.raw);
          return result.rating.then(function (rating) {
            paintCard(Object.assign({}, result.mapped, { imdbRating: rating }), result.raw);
          });
        }).catch(showError);
      });
      resultsList.appendChild(row);
    });
  }

  function runSearch() {
    resultsList.innerHTML = '<div class="note">buscando...</div>';
    MV.movieSource.search(queryInput.value).then(paintResults).catch(function (err) {
      resultsList.innerHTML = '<span class="bad">' + escapeHtml(err.message) + "</span>";
    });
  }

  document.getElementById("save-key").addEventListener("click", function () {
    MV.omdb.setKey(keyInput.value);
    keyInput.value = "";
    paintKeyStatus();
  });

  document.getElementById("clear-cache").addEventListener("click", function () {
    MV.omdb.clearCache();
    paintKeyStatus();
    keyStatus.textContent = keyStatus.textContent + " — cache borrado";
  });

  document.getElementById("run-search").addEventListener("click", runSearch);
  queryInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      runSearch();
    }
  });

  function normalize(value) {
    if (Array.isArray(value)) {
      return value.join(", ");
    }
    if (value === null || value === undefined) {
      return "";
    }
    return String(value);
  }

  // tres estados a proposito: vacio es que omdb no tiene el dato, distinto es que lo tiene pero no coincide con la coleccion
  // la igualdad se chequea primero porque un "-" que coincide de los dos lados es un acierto, no un hueco
  function compare(expectedValue, actualValue) {
    const actualText = normalize(actualValue);
    if (actualText === normalize(expectedValue)) {
      return "ok";
    }
    return actualText === "" || actualText === "-" ? "empty" : "different";
  }

  const STATE_CLASS = { ok: "ok", different: "warn", empty: "bad" };
  const STATE_LABEL = { ok: "ok", different: "dif", empty: "--" };

  // el panel dispara diez requests reales: sin este flag un segundo click encadena otra corrida y quema el doble de cupo sin que se note
  let assertsRunning = false;

  function runAsserts() {
    const expected = MV.omdbTestData.movies();
    const summaryBox = document.getElementById("summary");
    const container = document.getElementById("tests-table");
    if (assertsRunning) {
      return Promise.resolve();
    }
    assertsRunning = true;
    const assertsButton = document.getElementById("run-asserts");
    assertsButton.disabled = true;
    summaryBox.textContent = "pidiendo " + expected.length + " peliculas a tmdb...";
    container.innerHTML = "";

    const rows = [];
    const counts = { ok: 0, different: 0, empty: 0, error: 0 };

    // en serie y no en paralelo para no disparar requests juntas contra el cupo diario de omdb
    return expected.reduce(function (chain, movie) {
      return chain.then(function () {
        return MV.tmdb.findByImdbId(movie.imdbID).then(function (tmdbId) {
          if (!tmdbId) {
            throw new Error("tmdb no encontro " + movie.imdbID);
          }
          return MV.movieSource.getMovie(tmdbId);
        }).then(function (result) {
          // se espera el rating aca porque la celda de imdbRating tiene que compararse contra un valor ya resuelto
          return result.rating.then(function (rating) {
            return Object.assign({}, result.mapped, { imdbRating: rating });
          });
        }).then(function (mapped) {
          const cells = FIELDS.map(function (field) {
            const state = compare(movie[field], mapped[field]);
            counts[state] = counts[state] + 1;
            const tooltip = normalize(movie[field]) + "  ->  " + normalize(mapped[field]);
            return '<td class="' + STATE_CLASS[state] + '" title="' + escapeHtml(tooltip) + '">' + STATE_LABEL[state] + "</td>";
          });
          rows.push("<tr><th>" + escapeHtml(movie.title) + "</th>" + cells.join("") + "</tr>");
        }).catch(function (err) {
          counts.error = counts.error + 1;
          rows.push('<tr><th>' + escapeHtml(movie.title) + '</th><td class="bad" colspan="' + FIELDS.length + '">' + escapeHtml(err.message) + "</td></tr>");
        });
      });
    }, Promise.resolve()).then(function () {
      const header = "<tr><th>titulo</th>" + FIELDS.map(function (field) { return "<th>" + field + "</th>"; }).join("") + "</tr>";
      container.innerHTML = "<table>" + header + rows.join("") + "</table>";
      summaryBox.innerHTML = 'asserts: <span class="ok">' + counts.ok + " ok</span> / " +
        '<span class="warn">' + counts.different + " distintos</span> / " +
        '<span class="bad">' + counts.empty + " vacios</span> / " +
        counts.error + " errores sobre " + expected.length + " peliculas, las 3 series quedan fuera por ahora" +
        "  (pasar el mouse por una celda muestra esperado -> obtenido)";
      assertsRunning = false;
      assertsButton.disabled = false;
    }).catch(function (err) {
      // red de seguridad: el catch por titulo ya traga los rechazos de la cadena, esto solo cubre un throw dentro del pintado final
      assertsRunning = false;
      assertsButton.disabled = false;
      throw err;
    });
  }

  document.getElementById("run-asserts").addEventListener("click", runAsserts);

  seedKeyFromConfig();
  paintKeyStatus();
  window.MV_TEST = { FIELDS: FIELDS, runAsserts: runAsserts, compare: compare, normalize: normalize };
})();
</script>

</body>
</html>
